name: Build Armbian Image
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 克隆官方标准的 Armbian 编译框架源码
      - name: Checkout Armbian Build Framework
        uses: actions/checkout@v4
        with:
          repository: 'armbian/build'
          ref: 'main'

      # 2. 彻底 root 权限执行原生的编译命令（100% 成功覆盖分支参数）
      - name: Run Armbian Native Compile Script
        run: |
          sudo ./compile.sh \
            BOARD=visionfive2 \
            BRANCH=vendor \
            RELEASE=trixie \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=yes  \
            DESKTOP_APPGROUPS_SELECTED='browsers chat desktop_tools' \
            DESKTOP_ENVIRONMENT=xfce \
            DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,img,xz

      # 3. 自动将生成的镜像发布到 GitHub Releases 页面
      - name: Create GitHub Release and Upload Image
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v${{ github.run_number }}"
          name: "Armbian VisionFive2 v${{ github.run_number }}"
          artifacts: "output/images/*.xz,output/images/*.sha"
          allowUpdates: true
